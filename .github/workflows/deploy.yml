name: Deploy React App via SSH

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Descargar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Instalar dependencias
      - name: Install dependencies
        working-directory: frontend/Reac/mi-proyecto
        run: npm install

      # Construir React
      - name: Build React app
        working-directory: frontend/Reac/mi-proyecto
        run: npm run build

      # Instalar sshpass
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Deploy
      - name: Deploy via SSH
        env:
          SSH_HOST: 62.72.62.79
          SSH_PORT: 65002
          SSH_USER: u978793163
          SSH_PASSWORD: ${{ secrets.GT_SSH_PASSWORD }}

        run: |
          sshpass -p "$SSH_PASSWORD" scp \
          -P $SSH_PORT \
          -o StrictHostKeyChecking=no \
          -r ./frontend/Reac/mi-proyecto/dist/* \
          $SSH_USER@$SSH_HOST:~/public_html/

      # Permisos
      - name: Fix permissions
        env:
          SSH_HOST: 62.72.62.79
          SSH_PORT: 65002
          SSH_USER: u978793163
          SSH_PASSWORD: ${{ secrets.GT_SSH_PASSWORD }}

        run: |
          sshpass -p "$SSH_PASSWORD" ssh \
          -p $SSH_PORT \
          -o StrictHostKeyChecking=no \
          $SSH_USER@$SSH_HOST \
          "chmod -R 755 ~/public_html"